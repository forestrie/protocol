name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    name: Links resolve; no private sources cited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - run: python3 scripts/check-links.py

  mermaid:
    name: Every mermaid diagram renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: scripts/render-mermaid.sh

  vectors:
    name: Vectors are pinned, recompute from their fields, and verify with the pinned verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Every data file under vectors/ is pinned
        run: python3 scripts/check-pins.py
      - name: Pinned digests match
        run: sha256sum -c vectors/SHA256SUMS
      - name: Fixtures recompute from their fields (stdlib Python)
        run: python3 scripts/check-vectors.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Golden sets and fixtures verify with the published verifier
        run: |
          npm ci --prefix scripts/verify-golden
          node scripts/verify-golden/verify.mjs
